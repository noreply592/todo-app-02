<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할일 관리</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Malgun Gothic", system-ui, sans-serif; background: #f3f4f6; color: #1f2937; }
    .wrap { max-width: 560px; margin: 48px auto; padding: 0 16px; }
    h1 { margin: 0 0 20px; font-size: 28px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); padding: 20px; }
    form.add { display: flex; gap: 8px; }
    input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; }
    button { cursor: pointer; border: 0; border-radius: 8px; padding: 10px 14px; font-size: 14px; }
    .primary { background: #4f46e5; color: #fff; }
    .primary:hover { background: #4338ca; }
    .filters { display: flex; gap: 6px; margin: 16px 0 8px; align-items: center; }
    .filters a { text-decoration: none; color: #6b7280; padding: 4px 10px; border-radius: 999px; font-size: 14px; }
    .filters a.on { background: #eef2ff; color: #4f46e5; font-weight: bold; }
    .filters .count { margin-left: auto; font-size: 13px; color: #6b7280; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    li:last-child { border-bottom: 0; }
    li form { margin: 0; }
    .check { width: 26px; height: 26px; padding: 0; border: 2px solid #c7c9d1; background: #fff; border-radius: 50%; color: #fff; font-size: 14px; }
    li.done .check { background: #10b981; border-color: #10b981; }
    .title-form { flex: 1; }
    .title-form input { width: 100%; border: 1px solid transparent; background: transparent; padding: 6px 8px; }
    .title-form input:focus { border-color: #d1d5db; background: #fff; outline: none; }
    li.done .title-form input { text-decoration: line-through; color: #9ca3af; }
    .del { background: transparent; color: #ef4444; padding: 6px 8px; }
    .del:hover { background: #fee2e2; }
    .empty { text-align: center; color: #9ca3af; padding: 24px 0; }
    .footer { text-align: right; margin-top: 12px; }
    .footer button { background: transparent; color: #6b7280; font-size: 13px; }
    .footer button:hover { color: #ef4444; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📝 할일 관리</h1>
    <div class="card">
      <form class="add" action="{{ url_for('add') }}" method="post">
        <input type="text" name="title" placeholder="할 일을 입력하세요" autofocus required>
        <button class="primary" type="submit">추가</button>
      </form>

      <div class="filters">
        <a href="{{ url_for('index', filter='all') }}" class="{{ 'on' if status == 'all' }}">전체</a>
        <a href="{{ url_for('index', filter='active') }}" class="{{ 'on' if status == 'active' }}">진행중</a>
        <a href="{{ url_for('index', filter='done') }}" class="{{ 'on' if status == 'done' }}">완료</a>
        <span class="count">남은 할일 {{ remaining }}개</span>
      </div>

      <ul>
        {% for t in todos %}
        <li class="{{ 'done' if t.done }}">
          <form action="{{ url_for('toggle', todo_id=t.id) }}" method="post">
            <button class="check" title="완료 표시">{{ '✓' if t.done }}</button>
          </form>
          <form class="title-form" action="{{ url_for('edit', todo_id=t.id) }}" method="post">
            <input type="text" name="title" value="{{ t.title }}" title="수정 후 Enter">
          </form>
          <form action="{{ url_for('delete', todo_id=t.id) }}" method="post">
            <button class="del" title="삭제">삭제</button>
          </form>
        </li>
        {% else %}
        <li class="empty">할 일이 없습니다 🎉</li>
        {% endfor %}
      </ul>

      <form class="footer" action="{{ url_for('clear_done') }}" method="post">
        <button type="submit">완료된 항목 지우기</button>
      </form>
    </div>
  </div>
</body>
</html>
