<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할일 관리</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Malgun Gothic", system-ui, sans-serif; background: #f3f4f6; color: #1f2937; }
    .wrap { max-width: 560px; margin: 48px auto; padding: 0 16px; }
    h1 { margin: 0 0 20px; font-size: 28px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); padding: 20px; }
    form.add { display: flex; gap: 8px; }
    input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; }
    button { cursor: pointer; border: 0; border-radius: 8px; padding: 10px 14px; font-size: 14px; }
    .primary { background: #4f46e5; color: #fff; }
    .primary:hover { background: #4338ca; }
    .filters { display: flex; gap: 6px; margin: 16px 0 8px; align-items: center; }
    .filters button { background: transparent; color: #6b7280; padding: 4px 10px; border-radius: 999px; }
    .filters button.on { background: #eef2ff; color: #4f46e5; font-weight: bold; }
    .filters .count { margin-left: auto; font-size: 13px; color: #6b7280; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    li:last-child { border-bottom: 0; }
    .check { width: 26px; height: 26px; padding: 0; border: 2px solid #c7c9d1; background: #fff; border-radius: 50%; color: #fff; font-size: 14px; flex: none; }
    li.done .check { background: #10b981; border-color: #10b981; }
    .title { flex: 1; width: 100%; border: 1px solid transparent; background: transparent; padding: 6px 8px; }
    .title:focus { border-color: #d1d5db; background: #fff; outline: none; }
    li.done .title { text-decoration: line-through; color: #9ca3af; }
    .del { background: transparent; color: #ef4444; padding: 6px 8px; }
    .del:hover { background: #fee2e2; }
    .empty { justify-content: center; color: #9ca3af; padding: 24px 0; }
    .footer { text-align: right; margin-top: 12px; }
    .footer button { background: transparent; color: #6b7280; font-size: 13px; }
    .footer button:hover { color: #ef4444; }
    .note { margin-top: 12px; font-size: 12px; color: #9ca3af; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📝 할일 관리</h1>
    <div class="card">
      <form class="add" id="addForm">
        <input type="text" id="newTitle" placeholder="할 일을 입력하세요" autofocus required>
        <button class="primary" type="submit">추가</button>
      </form>

      <div class="filters">
        <button type="button" data-filter="all">전체</button>
        <button type="button" data-filter="active">진행중</button>
        <button type="button" data-filter="done">완료</button>
        <span class="count" id="count"></span>
      </div>

      <ul id="list"></ul>

      <div class="footer">
        <button type="button" id="clearDone">완료된 항목 지우기</button>
      </div>
    </div>
    <p class="note">할일은 이 브라우저에만 저장됩니다.</p>
  </div>

  <script>
    const KEY = "todos";
    let filter = "all";

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || []; }
      catch (e) { return []; }
    }
    function save(todos) {
      try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch (e) {}
    }
    let todos = load();

    function update(fn) { fn(); save(todos); render(); }

    function render() {
      const list = document.getElementById("list");
      list.innerHTML = "";
      const shown = todos
        .filter(t => filter === "all" || (filter === "done" ? t.done : !t.done))
        .sort((a, b) => (a.done - b.done) || (b.id - a.id));

      if (shown.length === 0) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = "할 일이 없습니다 🎉";
        list.appendChild(li);
      }

      for (const t of shown) {
        const li = document.createElement("li");
        if (t.done) li.className = "done";

        const check = document.createElement("button");
        check.className = "check";
        check.title = "완료 표시";
        check.textContent = t.done ? "✓" : "";
        check.onclick = () => update(() => { t.done = !t.done; });

        const title = document.createElement("input");
        title.type = "text";
        title.className = "title";
        title.value = t.title;
        title.title = "수정 후 Enter";
        const commit = () => {
          const v = title.value.trim();
          if (v && v !== t.title) update(() => { t.title = v; });
          else title.value = t.title;
        };
        title.onkeydown = e => { if (e.key === "Enter") title.blur(); };
        title.onblur = commit;

        const del = document.createElement("button");
        del.className = "del";
        del.title = "삭제";
        del.textContent = "삭제";
        del.onclick = () => update(() => { todos = todos.filter(x => x.id !== t.id); });

        li.append(check, title, del);
        list.appendChild(li);
      }

      document.getElementById("count").textContent =
        `남은 할일 ${todos.filter(t => !t.done).length}개`;
      document.querySelectorAll("[data-filter]").forEach(b =>
        b.classList.toggle("on", b.dataset.filter === filter));
    }

    document.getElementById("addForm").onsubmit = e => {
      e.preventDefault();
      const input = document.getElementById("newTitle");
      const v = input.value.trim();
      if (!v) return;
      const id = todos.reduce((m, t) => Math.max(m, t.id), 0) + 1;
      update(() => { todos.push({ id, title: v, done: false }); });
      input.value = "";
    };
    document.querySelectorAll("[data-filter]").forEach(b =>
      b.onclick = () => { filter = b.dataset.filter; render(); });
    document.getElementById("clearDone").onclick = () =>
      update(() => { todos = todos.filter(t => !t.done); });

    render();
  </script>
</body>
</html>
